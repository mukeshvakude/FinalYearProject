{% extends "layout.html" %}
{% block content %}

<div class="w3-card-4 w3-margin">

    <header class="w3-container w3-blue">
      <h1>Hide Message</h1>
    </header>

    <!-- IMAGE PREVIEW BLOCKS (shown only when filetype = image) -->
    <div id="image-blocks">
        <div class="w3-container w3-cell">
          <img src="static/images/test_image.png" alt="Image 1" style="width:100%">
          <br>
        </div>

        <div class="w3-container w3-cell">
          <img src="static/images/test_image1.png" alt="Image 2" style="width:100%">
          <br>
        </div>
    </div>

    <!-- MAIN FORM -->
    <form class="w3-container w3-margin" action="" method="post" enctype="multipart/form-data">

      <!-- FILETYPE SELECTION (INSIDE FORM so it is submitted) -->
      <label class="w3-text-teal"><b>Select Input Type</b></label>
      <select class="w3-select w3-border" name="filetype" id="filetype">
        <option value="image" {% if filetype != 'audio' %}selected{% endif %}>Image</option>
        <option value="audio" {% if filetype == 'audio' %}selected{% endif %}>Audio (WAV)</option>
      </select>
      <br><br>

      <!-- IMAGE UPLOAD -->
      <div id="image-upload">
          <div class="w3-cell">
            <input class="w3-btn w3-blue-grey" type="file" name="photo" accept="image/*"/>
            <br><br>
          </div>

          <div class="w3-cell">
            <input class="w3-btn w3-blue-grey w3-margin-left" type="file" name="photo1" accept="image/*"/>
            <input class="w3-btn w3-blue-grey" name="sub" type="submit" value="Upload"/>
            <br><br>
          </div>
      </div>

      <!-- AUDIO UPLOAD -->
      <div id="audio-upload" style="display:none;">
          <input class="w3-btn w3-blue-grey" type="file" name="audiofile" accept=".wav"/>
          <input class="w3-btn w3-blue-grey" name="sub" type="submit" value="Upload"/>
          <br><br>
      </div>

      <label class="w3-text-teal"><b>Secret Message</b></label>
      <textarea class="w3-input w3-border w3-light-grey" rows="10" cols="47" name="mgs"
      placeholder="Type Your Message Here..!!"></textarea>
      <br>

      <!-- Hide button (encrypt + embed) -->
      <input class="w3-btn w3-blue-grey" name="sub" type="submit" value="Hide">

    </form>

    <br>
    <footer class="w3-container w3-blue">
      <h5></h5>
    </footer>
</div>

<!-- CIPHER TEXT BLOCK -->
<div class="w3-card-4 w3-margin">

  <header class="w3-container w3-blue">
    <h1>Cipher Text</h1>
  </header>
  
  <div class="w3-container">
    <p>{{ cipher }}</p>
  </div>
  
  <footer class="w3-container w3-blue">
    <h5></h5>
  </footer>
  
</div>    


<!-- STEGO OUTPUT FOR IMAGE -->
<div id="stego-image-section" class="w3-card-4 w3-margin">

  <header class="w3-container w3-blue">
    <h1>Stego-Image</h1>
  </header>

  <div class="w3-cell">
    <img src="static/images/stegoImage.png" alt="Stego 1" style="width:100%">
    <br> 
  </div>

  <div class="w3-cell">
    <img src="static/images/stegoImage1.png" alt="Stego 2" style="width:100%">
    <br> 
  </div>
  
  <footer class="w3-container w3-blue">
    <h5></h5>
  </footer>
</div>

<!-- STEGO OUTPUT FOR AUDIO -->
<div id="stego-audio-section" class="w3-card-4 w3-margin" style="display:none;">

  <header class="w3-container w3-blue">
    <h1>Stego Audio</h1>
  </header>

  <div class="w3-container w3-padding">
      <audio controls>
        <source src="static/audio/stego_audio.wav" type="audio/wav">
        Your browser does not support the audio element.
      </audio>

      <br><br>
      <a href="static/audio/stego_audio.wav" download class="w3-btn w3-green">Download Stego Audio</a>
  </div>

  <footer class="w3-container w3-blue">
    <h5></h5>
  </footer>

</div>


<!-- SUCCESS MODAL -->
<div id="successModal" class="w3-modal" style="display:none;">
  <div class="w3-modal-content w3-animate-top w3-card-4" style="max-width:400px;">
    <header class="w3-container w3-green">
      <h3>Success</h3>
    </header>

    <div class="w3-container w3-padding">
      <p>Message encrypted and hidden successfully!</p>
    </div>

    <footer class="w3-container w3-green w3-padding">
      <button onclick="closeSuccessModal()" class="w3-button w3-white w3-round-large">
        OK
      </button>
    </footer>
  </div>
</div>


<script>
function showSuccessModal() {
    document.getElementById('successModal').style.display = 'block';
}

function closeSuccessModal() {
    document.getElementById('successModal').style.display = 'none';
}

// Toggle UI based on selection
document.addEventListener("DOMContentLoaded", function() {
    const sel = document.getElementById("filetype");

    function toggleUI() {
        if (sel && sel.value === "audio") {
            document.getElementById("audio-upload").style.display = "block";
            document.getElementById("image-upload").style.display = "none";
            document.getElementById("image-blocks").style.display = "none";
            document.getElementById("stego-image-section").style.display = "none";
            document.getElementById("stego-audio-section").style.display = "block";
        } else {
            document.getElementById("audio-upload").style.display = "none";
            document.getElementById("image-upload").style.display = "block";
            document.getElementById("image-blocks").style.display = "block";
            document.getElementById("stego-image-section").style.display = "block";
            document.getElementById("stego-audio-section").style.display = "none";
        }
    }

    if (sel) {
        sel.addEventListener("change", toggleUI);
    }
    toggleUI();
});
</script>

{% if cipher %}
<script>
    showSuccessModal();
</script>
{% endif %}

{% endblock %}
